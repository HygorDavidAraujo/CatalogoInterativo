<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Redefinir Senha</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <main class="container" style="max-width:520px;margin:3rem auto;">
    <h2>Redefinir Senha</h2>
    <p>Informe a nova senha para sua conta.</p>
    <form id="form-reset-senha">
      <input type="hidden" id="reset-token" name="token" />
      <div class="form-group">
        <label for="nova-senha">Nova Senha</label>
        <input type="password" id="nova-senha" required placeholder="Digite a nova senha" />
      </div>
      <div class="form-group">
        <label for="confirmar-senha">Confirmar Senha</label>
        <input type="password" id="confirmar-senha" required placeholder="Confirme a nova senha" />
      </div>
      <div id="reset-erro" class="mensagem-erro-auth" style="display:none;"></div>
      <div id="reset-sucesso" class="mensagem-sucesso-auth" style="display:none;"></div>
      <button type="submit" class="btn btn-primary">Redefinir Senha</button>
    </form>
  </main>
  <script src="js/reset-senha.js"></script>
</body>
</html>
